name: anoieu

on: [push, pull_request]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the policy checker, at the commit this repository pins
        env:
          # The checker this tree is measured against, and the only lever this
          # repository has over what it is held to. It moves only onto a commit
          # where anoieu's own build is green: all 7 check runs pass at
          # 154228a. (Read from anoieu's CI 2026-09-17.)
          ANOIEU_REV: 154228a40d21584b95f4029742ccc8f432ea87f5
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu "$RUNNER_TEMP/anoieu"
          git -C "$RUNNER_TEMP/anoieu" checkout --quiet --detach "$ANOIEU_REV"
      # The contract is named rather than defaulted, so a later anoieu that
      # changes what the default selects cannot change what this build asks
      # for. The entry-point path belongs to the pin above; move the two
      # together.
      - name: the mechanical policy contract this tree is checked against
        run: >-
          python3 "$RUNNER_TEMP/anoieu/scripts/policy_check.py"
          --policy-version 1 --root "$GITHUB_WORKSPACE"
