name: anoieu

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the policy checker, at the commit this repository pins
        env:
          # The checker this repository is held to. Chosen as the newest commit
          # of the checker with a green build: all 7 of anoieu's check runs pass
          # at 6f9ee38, verified 2026-09-17, which is the policy's requirement
          # for moving a pin. kanon pins the older 87ad682; this tree is a member
          # in its own right and picks its own commit.
          #
          # It was first pinned here for a reason that no longer applies: this
          # repository carried the `associate` footing, and 6f9ee38 is the
          # earliest revision whose policy_check.py knows that footing. The
          # footing was dropped for full membership on 2026-09-17, so the pin now
          # rests on being current and green rather than on that.
          ANOIEU_REV: 6f9ee38b3c142dce22458a5ba290c062b7899aa9
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu /tmp/anoieu
          git -C /tmp/anoieu checkout --quiet "$ANOIEU_REV"
      # The path belongs to the pin: the checker moved from tools/ to scripts/
      # in anoieu's own history. Move the two together.
      - run: python3 /tmp/anoieu/scripts/policy_check.py --root .
